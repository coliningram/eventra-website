name: Update sitemap lastmod

# Keeps <lastmod> in sitemap.xml honest: when a page's own HTML changes on main,
# that one URL gets the commit date. Nothing else in the file moves.
#
# The whole point is that a shared-chrome edit (nav, footer, favicon, canonical
# sweep, sitewide CSS) must NOT reset every date. A sitemap that stamps all 73
# URLs with today on one nav tweak teaches Google to ignore the field. Two
# mechanisms enforce that:
#   1. Only pages whose own index.html changed in the push are touched.
#   2. A commit whose message contains [chrome] is skipped entirely, which is
#      how a deliberate sitewide sweep declares itself.
#   3. A hard cap (MAX_URLS) fails the run rather than mass-stamping, so a sweep
#      that forgot the [chrome] marker is loud instead of silent.
#
# LOOP PROTECTION (three layers, see the board answer on EVE-768):
#   a. `paths:` filter — this workflow only triggers on **/index.html. The bot's
#      own commit touches sitemap.xml and nothing else, so it cannot re-trigger.
#      This is the real guard.
#   b. Actor guard — the job is skipped when github.actor is github-actions[bot].
#   c. No-op guard — the commit step exits 0 without committing when sitemap.xml
#      is byte-identical after regeneration. No empty commits, ever.
#
# Deliberately NO "[skip ci]" in the bot's commit message. The sitemap change has
# to reach Cloudflare's build or the updated file never deploys. Workers Builds
# ignores [skip ci] today but Cloudflare Pages already honours it and it is an
# open request for Workers (cloudflare/workers-sdk#11061); including the flag
# would silently stop sitemap updates from going live the day that lands. Loop
# protection does not need it — layer (a) already closes the loop.

on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sitemap-lastmod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lastmod:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the pushed range, not just the tip, to see which pages changed.
          fetch-depth: 0

      - name: Stamp lastmod for changed pages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          BASE = 'https://eventragroup.com'
          SITEMAP = 'sitemap.xml'
          MAX_URLS = 20

          # URLs deliberately absent from sitemap.xml. Touching these pages must
          # not fail the run and must not add them.
          #   /experiences/concerts-culture/ and its children: production
          #   robots.txt has disallowed this path since 2026-05-12 (EVE-392).
          #   Listing a robots-disallowed URL only earns a GSC "Submitted URL
          #   blocked by robots.txt" error. Confirmed by the board 2026-08-17.
          EXCLUDE_PREFIXES = ('/experiences/concerts-culture/',)

          def sh(*args):
              return subprocess.run(['git', *args], capture_output=True, text=True,
                                    check=True).stdout

          before, after = os.environ.get('BEFORE', ''), os.environ['AFTER']
          zero = before in ('', '0' * 40) or not before
          if zero:
              commits = [after]
          else:
              try:
                  sh('cat-file', '-e', before + '^{commit}')
                  commits = sh('rev-list', '--reverse', f'{before}..{after}').split()
              except subprocess.CalledProcessError:
                  # Force-push or unreachable base. Fall back to the tip commit.
                  commits = [after]
          if not commits:
              print('No commits in range. Nothing to do.')
              sys.exit(0)

          def url_for(path):
              if path == 'index.html':
                  return BASE + '/'
              if path.endswith('/index.html'):
                  return BASE + '/' + path[:-len('index.html')]
              return None

          # newest date wins per URL
          stamped, skipped_chrome = {}, []
          for c in commits:
              msg = sh('log', '-1', '--format=%B', c)
              date = sh('log', '-1', '--format=%cs', c).strip()
              if '[chrome]' in msg:
                  skipped_chrome.append(f'{c[:8]} {msg.splitlines()[0][:70]}')
                  continue
              files = sh('show', '--name-only', '--format=', '--diff-filter=d', c).split()
              for f in files:
                  u = url_for(f)
                  if u:
                      stamped[u] = date

          for line in skipped_chrome:
              print(f'Skipped as [chrome]: {line}')

          if not stamped:
              print('No page content changes in this push. Nothing to stamp.')
              sys.exit(0)

          src = open(SITEMAP).read()
          listed = set(re.findall(r'<loc>(.*?)</loc>', src))

          unlisted = sorted(
              u for u in stamped
              if u not in listed
              and not any(u.replace(BASE, '').startswith(p) for p in EXCLUDE_PREFIXES)
          )
          if unlisted:
              print('FAIL: page changed but its URL is not in sitemap.xml:')
              for u in unlisted:
                  print('  ' + u)
              print('Add it to sitemap.xml, or add its prefix to EXCLUDE_PREFIXES '
                    'with the reason, then re-run.')
              sys.exit(1)

          targets = {u: d for u, d in stamped.items() if u in listed}
          if len(targets) > MAX_URLS:
              print(f'FAIL: {len(targets)} URLs would be stamped, cap is {MAX_URLS}.')
              print('This looks like a sitewide chrome sweep. Mass-stamping every '
                    'date destroys the value of the field.')
              print('Either mark the sweep commit [chrome] and re-run, or edit '
                    'sitemap.xml by hand for the pages whose content really changed.')
              for u in sorted(targets):
                  print('  ' + u)
              sys.exit(1)

          def rep(m):
              u = m.group(1)
              d = targets.get(u)
              if not d:
                  return m.group(0)
              return f'<url><loc>{u}</loc><lastmod>{d}</lastmod></url>'

          out = re.sub(r'<url><loc>(.*?)</loc>(?:<lastmod>.*?</lastmod>)?</url>', rep, src)
          if out == src:
              print('lastmod values already current. No write.')
              sys.exit(0)
          open(SITEMAP, 'w').write(out)
          for u in sorted(targets):
              print(f'Stamped {targets[u]}  {u}')
          PY

      - name: Commit and push if changed
        run: |
          # No-op guard. An unchanged sitemap.xml means no commit at all, so the
          # push trigger never fires on a date that did not actually move.
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore(sitemap): update lastmod for changed pages

          Co-Authored-By: Paperclip <noreply@paperclip.ing>"
          git push
